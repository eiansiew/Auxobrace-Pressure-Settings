<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxobrace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Make the slider look premium */
        input[type=range] {
            accent-color: #3b82f6; 
        }
        
        /* Custom thin scrollbar for the dashboard */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; 
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center p-4">

    <!-- MAIN APP CONTAINER -->
    <div class="bg-slate-50 rounded-[2rem] shadow-2xl w-full max-w-md h-[85vh] max-h-[850px] flex flex-col overflow-hidden border border-slate-300">
        
        <!-- STICKY HEADER -->
        <div class="px-6 pt-8 pb-6 bg-white z-20 border-b border-slate-200 shrink-0">
            <h1 class="text-2xl font-black text-slate-800 text-center mb-1 tracking-tight">Auxobrace</h1>
            <p id="statusText" class="text-sm font-medium text-slate-400 text-center mb-5">Ready to connect.</p>

            <!-- Live Data Display -->
            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200 shadow-inner flex flex-col items-center justify-center">
                <h2 class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-1">Live Pressure</h2>
                <div class="text-5xl font-black text-blue-600 tracking-tighter flex items-baseline">
                    <span id="livePressure">0.0</span>
                    <span class="text-xl text-slate-400 font-bold ml-2">kPa</span>
                </div>
            </div>
        </div>

        <!-- SCROLLABLE BODY -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
            
            <!-- Target Pressure Settings (Isolated Card) -->
            <div id="settingsPanel" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 opacity-40 pointer-events-none transition-opacity duration-300">
                <h2 class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-4">Target Pressure</h2>
                
                <div class="flex items-center justify-between mb-3">
                    <span class="text-slate-400 font-semibold text-xs">Soft (10)</span>
                    <span id="targetLabel" class="text-4xl font-black text-slate-800">40.0</span>
                    <span class="text-slate-400 font-semibold text-xs">Firm (40)</span>
                </div>
                
                <input type="range" id="targetSlider" min="10" max="40" step="1" value="40" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                <p class="text-[11px] text-slate-400 mt-4 text-center font-medium leading-relaxed">Adjusting this slider updates the hardware target directly via Bluetooth.</p>
            </div>

            <!-- Graph Accordion Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <button id="toggleGraphBtn" class="w-full flex items-center justify-between p-5 bg-white hover:bg-slate-50 text-slate-700 font-bold transition-colors opacity-40 pointer-events-none">
                    <span>Live Graph</span>
                    <svg id="graphChevron" class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div id="graphContainer" class="hidden p-4 border-t border-slate-100 h-56 bg-slate-50/50">
                    <canvas id="pressureChart"></canvas>
                </div>
            </div>

            <!-- Usage Statistics Accordion Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <button id="toggleStatsBtn" class="w-full flex items-center justify-between p-5 bg-white hover:bg-slate-50 text-slate-700 font-bold transition-colors opacity-40 pointer-events-none">
                    <span>Usage Statistics</span>
                    <svg id="statsChevron" class="w-5 h-5 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div id="statsContainer" class="hidden p-6 border-t border-slate-100 space-y-5 bg-slate-50/50">
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1">Lifetime Uses</p>
                        <p id="statTotal" class="text-3xl font-black text-slate-800">0</p>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1">Time Since Last Use</p>
                        <p id="statGap" class="text-3xl font-black text-slate-800">0h 0m</p>
                    </div>
                    
                    <div class="pt-2 space-y-3">
                        <!-- CSV Download Button -->
                        <button id="downloadCsvBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Export to CSV
                        </button>
                        
                        <!-- Reset Stats Button -->
                        <button id="resetStatsBtn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 text-sm font-bold py-3.5 px-4 rounded-xl transition-all duration-200">
                            Reset Statistics
                        </button>
                    </div>
                </div>
            </div>

        </div> <!-- END SCROLLABLE SECTION -->

        <!-- STICKY FOOTER -->
        <div class="p-6 bg-white z-20 border-t border-slate-200 shrink-0">
            <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-md transition-all active:scale-95">
                Connect via Bluetooth
            </button>
        </div>

    </div> <!-- END MAIN APP CONTAINER -->

    <script>
        // UUIDs
        const SERVICE_UUID = "4fafc202-1fb5-459e-8fcc-c5c9c331914b";
        const PRESSURE_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const TARGET_CHAR_UUID = "cba1d466-344c-4be3-ab3f-189f80dd7518";
        const STATS_CHAR_UUID = "f1a073f1-d0b4-4b8a-9e19-5d27b9df0996";
        const HISTORY_CHAR_UUID = "f1a073f2-d0b4-4b8a-9e19-5d27b9df0996";

        let bleDevice = null;
        let targetCharacteristic = null;
        let statsCharacteristic = null;
        let historyCharacteristic = null;

        // Stats state for CSV
        let currentTotalActivations = 0;
        let currentGapMinutes = 0;

        // UI Elements
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const livePressure = document.getElementById('livePressure');
        const settingsPanel = document.getElementById('settingsPanel');
        const targetSlider = document.getElementById('targetSlider');
        const targetLabel = document.getElementById('targetLabel');

        const toggleStatsBtn = document.getElementById('toggleStatsBtn');
        const statsContainer = document.getElementById('statsContainer');
        const statsChevron = document.getElementById('statsChevron');
        const statTotal = document.getElementById('statTotal');
        const statGap = document.getElementById('statGap');

        const toggleGraphBtn = document.getElementById('toggleGraphBtn');
        const graphContainer = document.getElementById('graphContainer');
        const graphChevron = document.getElementById('graphChevron');
        const ctx = document.getElementById('pressureChart').getContext('2d');

        // Chart.js Initialization
        const maxDataPoints = 60; 
        const pressureChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(maxDataPoints).fill(''), 
                datasets: [{
                    label: 'Pressure (kPa)',
                    data: Array(maxDataPoints).fill(0),
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, 
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                scales: {
                    y: { 
                        beginAtZero: true,
                        max: 45, 
                        grid: { color: '#e2e8f0' }
                    },
                    x: { display: false } 
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });

        // Toggle Menus
        toggleGraphBtn.addEventListener('click', () => {
            graphContainer.classList.toggle('hidden');
            graphChevron.classList.toggle('rotate-180');
        });

        toggleStatsBtn.addEventListener('click', () => {
            statsContainer.classList.toggle('hidden');
            statsChevron.classList.toggle('rotate-180');
        });

        // 1. Handle Connect Button Click
        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }

            try {
                statusText.innerText = "Scanning for Auxobrace...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusText.innerText = "Connecting...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                const pressureCharacteristic = await service.getCharacteristic(PRESSURE_CHAR_UUID);
                targetCharacteristic = await service.getCharacteristic(TARGET_CHAR_UUID);
                statsCharacteristic = await service.getCharacteristic(STATS_CHAR_UUID);
                historyCharacteristic = await service.getCharacteristic(HISTORY_CHAR_UUID);

                // Subscribe to updates
                await pressureCharacteristic.startNotifications();
                pressureCharacteristic.addEventListener('characteristicvaluechanged', handlePressureUpdate);

                await statsCharacteristic.startNotifications();
                statsCharacteristic.addEventListener('characteristicvaluechanged', handleStatsUpdate);
                
                // Read initial data
                const initialStatsVal = await statsCharacteristic.readValue();
                handleStatsUpdate({ target: { value: initialStatsVal } });

                const targetVal = await targetCharacteristic.readValue();
                const currentTargetStr = new TextDecoder().decode(targetVal);
                targetSlider.value = parseFloat(currentTargetStr);
                targetLabel.innerText = parseFloat(currentTargetStr).toFixed(1);

                // Update UI visually
                statusText.innerText = "Connected \u2714\uFE0F";
                connectBtn.innerText = "Disconnect";
                connectBtn.classList.replace('bg-blue-600', 'bg-slate-800');
                connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-slate-900');
                
                // Enable panels
                settingsPanel.classList.remove('opacity-40', 'pointer-events-none');
                toggleGraphBtn.classList.remove('opacity-40', 'pointer-events-none');
                toggleStatsBtn.classList.remove('opacity-40', 'pointer-events-none');

            } catch (error) {
                console.error(error);
                statusText.innerText = "Connection failed or cancelled.";
            }
        });

        // 2. Handle Incoming Live Data
        function handlePressureUpdate(event) {
            const value = event.target.value;
            const pressureString = new TextDecoder().decode(value);
            livePressure.innerText = pressureString;
            
            const pressureVal = parseFloat(pressureString);
            pressureChart.data.datasets[0].data.push(pressureVal);
            pressureChart.data.datasets[0].data.shift(); 
            pressureChart.update();
        }

        // 3. Handle Incoming Stats Data
        function handleStatsUpdate(event) {
            const value = event.target.value;
            const statsString = new TextDecoder().decode(value); 
            
            const parts = statsString.split(',');
            if (parts.length === 2) {
                const total = parseInt(parts[0]);
                const totalMinutes = parseInt(parts[1]);
                
                currentTotalActivations = total;
                currentGapMinutes = totalMinutes;
                
                const hours = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                
                statTotal.innerText = total;
                statGap.innerText = `${hours}h ${mins}m`;
            }
        }

        // CSV Export
        document.getElementById('downloadCsvBtn').addEventListener('click', async () => {
            let historyArray = [];
            if (historyCharacteristic) {
                try {
                    const historyVal = await historyCharacteristic.readValue();
                    const historyStr = new TextDecoder().decode(historyVal);
                    if (historyStr) {
                        historyArray = historyStr.split(',');
                    }
                } catch (e) {
                    console.error("Could not read history", e);
                }
            }

            const date = new Date().toLocaleString();
            let csvContent = "Auxobrace Usage Report\nGenerated:,\"" + date + "\"\n\n";
            csvContent += "Overall Statistics\n";
            csvContent += `Lifetime Uses,${currentTotalActivations}\n`;
            csvContent += `Minutes Since Last Use,${currentGapMinutes}\n\n`;
            
            csvContent += "Recent Activation History (Last 30 Uses)\n";
            csvContent += "Use #,Minutes Since Previous Use\n";
            
            if (historyArray.length > 0) {
                historyArray.forEach((gap, index) => {
                    csvContent += `${index + 1},${gap}\n`;
                });
            } else {
                csvContent += "No history recorded yet.,\n";
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `auxobrace_stats_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Reset Stats Logic
        let resetConfirmTimeout;
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        
        resetStatsBtn.addEventListener('click', async () => {
            if (!statsCharacteristic) return;
            
            if (resetStatsBtn.innerText.trim() === "Reset Statistics") {
                resetStatsBtn.innerText = "Click again to confirm.";
                resetStatsBtn.classList.replace('bg-red-50', 'bg-red-500');
                resetStatsBtn.classList.replace('text-red-600', 'text-white');
                resetStatsBtn.classList.replace('hover:bg-red-100', 'hover:bg-red-600');
                
                resetConfirmTimeout = setTimeout(() => {
                    resetStatsBtn.innerText = "Reset Statistics";
                    resetStatsBtn.classList.replace('bg-red-500', 'bg-red-50');
                    resetStatsBtn.classList.replace('text-white', 'text-red-600');
                    resetStatsBtn.classList.replace('hover:bg-red-600', 'hover:bg-red-100');
                }, 3000);
            } else {
                clearTimeout(resetConfirmTimeout);
                try {
                    const encoder = new TextEncoder();
                    await statsCharacteristic.writeValue(encoder.encode("RESET"));
                    
                    resetStatsBtn.innerText = "Reset Statistics";
                    resetStatsBtn.classList.replace('bg-red-500', 'bg-red-50');
                    resetStatsBtn.classList.replace('text-white', 'text-red-600');
                    resetStatsBtn.classList.replace('hover:bg-red-600', 'hover:bg-red-100');
                } catch (error) {
                    console.error("Failed to write reset command", error);
                }
            }
        });

        // 4. Slider Changes
        targetSlider.addEventListener('input', (e) => {
            targetLabel.innerText = parseFloat(e.target.value).toFixed(1);
        });

        targetSlider.addEventListener('change', async (e) => {
            if (!targetCharacteristic) return;
            const newValue = e.target.value;
            
            try {
                const encoder = new TextEncoder();
                await targetCharacteristic.writeValue(encoder.encode(newValue.toString()));
            } catch (error) {
                console.error("Failed to write to device", error);
            }
        });

        // 5. Disconnection
        function onDisconnected() {
            statusText.innerText = "Device disconnected.";
            livePressure.innerText = "0.0";
            connectBtn.innerText = "Connect via Bluetooth";
            connectBtn.classList.replace('bg-slate-800', 'bg-blue-600');
            connectBtn.classList.replace('hover:bg-slate-900', 'hover:bg-blue-700');
            settingsPanel.classList.add('opacity-40', 'pointer-events-none');
            toggleGraphBtn.classList.add('opacity-40', 'pointer-events-none');
            toggleStatsBtn.classList.add('opacity-40', 'pointer-events-none');
            
            statsCharacteristic = null;
            pressureChart.data.datasets[0].data.fill(0);
            pressureChart.update();
        }

    </script>
</body>
</html>
