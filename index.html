<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxobrace Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Make the slider look a bit nicer */
        input[type=range] {
            accent-color: #3b82f6; /* Tailwind blue-500 */
        }
        /* Custom thin scrollbar for the dashboard */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md flex flex-col max-h-[90vh] overflow-hidden">
        
        <!-- STICKY TOP SECTION -->
        <div class="p-6 pb-4 shrink-0 border-b border-slate-100 bg-white z-10 text-center shadow-sm">
            <h1 class="text-3xl font-bold text-slate-800 mb-1">Auxobrace Settings</h1>
            <p id="statusText" class="text-slate-500 mb-4">Ready to connect.</p>

            <!-- Live Data Display -->
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 shadow-inner">
                <h2 class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">Live Pressure</h2>
                <div class="text-5xl font-black text-blue-600 flex items-baseline justify-center">
                    <span id="livePressure">0.0</span>
                    <span class="text-xl text-slate-400 ml-2">kPa</span>
                </div>
            </div>
        </div>

        <!-- SCROLLABLE BOTTOM SECTION -->
        <div class="overflow-y-auto flex-grow w-full custom-scrollbar">
            
            <!-- INNER PADDING WRAPPER: Keeps everything away from the absolute edges -->
            <div class="p-6 flex flex-col gap-4 text-center">

                <!-- Graph Dropdown Toggle -->
                <button id="toggleGraphBtn" class="w-full flex items-center justify-between bg-slate-50 hover:bg-slate-100 text-slate-600 font-semibold py-3 px-6 rounded-xl border border-slate-200 transition-all pointer-events-none opacity-30">
                    <span>Live Graph</span>
                    <svg id="graphChevron" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Graph Container (Hidden by default) -->
                <div id="graphContainer" class="hidden bg-white border border-slate-100 rounded-xl p-4 shadow-sm w-full h-56">
                    <canvas id="pressureChart"></canvas>
                </div>

                <!-- Usage Stats Dropdown Toggle -->
                <button id="toggleStatsBtn" class="w-full flex items-center justify-between bg-slate-50 hover:bg-slate-100 text-slate-600 font-semibold py-3 px-6 rounded-xl border border-slate-200 transition-all pointer-events-none opacity-30">
                    <span>Usage Statistics</span>
                    <svg id="statsChevron" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Stats Container (Hidden by default) -->
                <div id="statsContainer" class="hidden bg-white border border-slate-100 rounded-xl p-6 shadow-sm w-full text-left">
                    <div class="mb-4">
                        <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">Lifetime Uses</p>
                        <p id="statTotal" class="text-2xl font-bold text-slate-800">0</p>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">Time Since Last Use</p>
                        <p id="statGap" class="text-2xl font-bold text-slate-800">0h 0m</p>
                    </div>
                    
                    <!-- CSV Download Button -->
                    <button id="downloadCsvBtn" class="mt-6 w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download Data (.csv)
                    </button>
                    
                    <!-- Reset Stats Button -->
                    <button id="resetStatsBtn" class="mt-3 w-full bg-red-50 hover:bg-red-100 text-red-600 text-sm font-semibold py-3 px-4 rounded-xl transition-all duration-200">
                        Reset Statistics
                    </button>
                </div>

                <!-- Settings (Initially Hidden) -->
                <div id="settingsPanel" class="opacity-30 pointer-events-none transition-opacity duration-300 w-full mt-4 mb-4">
                    <h2 class="text-sm uppercase tracking-widest text-slate-400 font-semibold mb-4 text-left">Target Pressure</h2>
                    
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-slate-500 font-medium text-sm">Soft (10)</span>
                        <span id="targetLabel" class="text-3xl font-bold text-slate-800">40.0</span>
                        <span class="text-slate-500 font-medium text-sm">Firm (40)</span>
                    </div>
                    
                    <input type="range" id="targetSlider" min="10" max="40" step="1" value="40" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                    <p class="text-xs text-slate-400 mt-3 text-center">Adjusting this sends data directly to the hardware.</p>
                </div>

                <!-- Connect Button -->
                <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all active:scale-95 mt-2">
                    Connect via Bluetooth
                </button>

            </div> <!-- END INNER PADDED WRAPPER -->
        </div> <!-- END SCROLLABLE SECTION -->
    </div> <!-- END MAIN CARD -->

    <script>
        // CRITICAL: These MUST perfectly match your ESP32 Code
        const SERVICE_UUID = "4fafc202-1fb5-459e-8fcc-c5c9c331914b";
        const PRESSURE_CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const TARGET_CHAR_UUID = "cba1d466-344c-4be3-ab3f-189f80dd7518";
        const STATS_CHAR_UUID = "f1a073f1-d0b4-4b8a-9e19-5d27b9df0996";

        let bleDevice = null;
        let targetCharacteristic = null;
        let statsCharacteristic = null; // NEW: Made global so the reset button can use it

        // Stats state for CSV
        let currentTotalActivations = 0;
        let currentGapMinutes = 0;

        // UI Elements
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const livePressure = document.getElementById('livePressure');
        const settingsPanel = document.getElementById('settingsPanel');
        const targetSlider = document.getElementById('targetSlider');
        const targetLabel = document.getElementById('targetLabel');

        // Stats Elements
        const toggleStatsBtn = document.getElementById('toggleStatsBtn');
        const statsContainer = document.getElementById('statsContainer');
        const statsChevron = document.getElementById('statsChevron');
        const statTotal = document.getElementById('statTotal');
        const statGap = document.getElementById('statGap');

        // Graph Elements
        const toggleGraphBtn = document.getElementById('toggleGraphBtn');
        const graphContainer = document.getElementById('graphContainer');
        const graphChevron = document.getElementById('graphChevron');
        const ctx = document.getElementById('pressureChart').getContext('2d');

        // Chart.js Initialization
        const maxDataPoints = 60; // Keeps a rolling window of the last 60 readings
        const pressureChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(maxDataPoints).fill(''), 
                datasets: [{
                    label: 'Pressure (kPa)',
                    data: Array(maxDataPoints).fill(0),
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, 
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                scales: {
                    y: { 
                        beginAtZero: true,
                        max: 45, 
                        grid: { color: '#f1f5f9' }
                    },
                    x: { display: false } 
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });

        // Toggle Menus
        toggleGraphBtn.addEventListener('click', () => {
            graphContainer.classList.toggle('hidden');
            graphChevron.classList.toggle('rotate-180');
        });

        toggleStatsBtn.addEventListener('click', () => {
            statsContainer.classList.toggle('hidden');
            statsChevron.classList.toggle('rotate-180');
        });

        // 1. Handle Connect Button Click
        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }

            try {
                statusText.innerText = "Scanning for Auxobrace...";
                
                // BYPASS NAME CACHE: We ONLY look for the UUID, ignoring the device name entirely!
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                // Connect to GATT Server
                statusText.innerText = "Connecting...";
                const server = await bleDevice.gatt.connect();

                // Get the Service
                const service = await server.getPrimaryService(SERVICE_UUID);

                // Get the Characteristics
                const pressureCharacteristic = await service.getCharacteristic(PRESSURE_CHAR_UUID);
                targetCharacteristic = await service.getCharacteristic(TARGET_CHAR_UUID);
                statsCharacteristic = await service.getCharacteristic(STATS_CHAR_UUID); // UPDATED

                // Subscribe to live pressure updates
                await pressureCharacteristic.startNotifications();
                pressureCharacteristic.addEventListener('characteristicvaluechanged', handlePressureUpdate);

                // Subscribe to Usage Stats updates
                await statsCharacteristic.startNotifications();
                statsCharacteristic.addEventListener('characteristicvaluechanged', handleStatsUpdate);
                
                // Read the initial stats immediately upon connection to populate the UI
                const initialStatsVal = await statsCharacteristic.readValue();
                handleStatsUpdate({ target: { value: initialStatsVal } });

                // Read the current target from the ESP32 to sync the slider
                const targetVal = await targetCharacteristic.readValue();
                const currentTargetStr = new TextDecoder().decode(targetVal);
                targetSlider.value = parseFloat(currentTargetStr);
                targetLabel.innerText = parseFloat(currentTargetStr).toFixed(1);

                // Update UI visually
                statusText.innerText = "Connected \u2714\uFE0F";
                connectBtn.innerText = "Disconnect";
                connectBtn.classList.replace('bg-blue-600', 'bg-red-500');
                connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                
                // Enable settings and dropdown panels
                settingsPanel.classList.remove('opacity-30', 'pointer-events-none');
                toggleGraphBtn.classList.remove('opacity-30', 'pointer-events-none');
                toggleStatsBtn.classList.remove('opacity-30', 'pointer-events-none');

            } catch (error) {
                console.error(error);
                statusText.innerText = "Connection failed or cancelled.";
            }
        });

        // 2. Handle Incoming Live Data
        function handlePressureUpdate(event) {
            const value = event.target.value;
            const pressureString = new TextDecoder().decode(value);
            livePressure.innerText = pressureString;
            
            // Push new data to the graph and slide the window
            const pressureVal = parseFloat(pressureString);
            pressureChart.data.datasets[0].data.push(pressureVal);
            pressureChart.data.datasets[0].data.shift(); 
            pressureChart.update();
        }

        // 3. Handle Incoming Stats Data
        function handleStatsUpdate(event) {
            const value = event.target.value;
            const statsString = new TextDecoder().decode(value); // e.g. "5,120"
            
            const parts = statsString.split(',');
            if (parts.length === 2) {
                const total = parseInt(parts[0]);
                const totalMinutes = parseInt(parts[1]);
                
                // Save for CSV download
                currentTotalActivations = total;
                currentGapMinutes = totalMinutes;
                
                // Convert raw minutes into a clean Hours/Minutes format
                const hours = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                
                statTotal.innerText = total;
                statGap.innerText = `${hours}h ${mins}m`;
            }
        }

        // Handle CSV Download
        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            const date = new Date().toLocaleString();
            let csvContent = "Data Type,Value,Timestamp\n";
            csvContent += `Lifetime Uses,${currentTotalActivations},"${date}"\n`;
            csvContent += `Minutes Since Last Use,${currentGapMinutes},"${date}"\n`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `auxobrace_stats_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // NEW: Handle Reset Stats Button with built-in "Are you sure?" confirmation
        let resetConfirmTimeout;
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        
        resetStatsBtn.addEventListener('click', async () => {
            if (!statsCharacteristic) return;
            
            // If it's the first click, ask for confirmation
            if (resetStatsBtn.innerText.trim() === "Reset Statistics") {
                resetStatsBtn.innerText = "Are you sure? Click to confirm.";
                resetStatsBtn.classList.replace('bg-red-50', 'bg-red-500');
                resetStatsBtn.classList.replace('text-red-600', 'text-white');
                resetStatsBtn.classList.replace('hover:bg-red-100', 'hover:bg-red-600');
                
                // Reset back to normal if they don't confirm within 3 seconds
                resetConfirmTimeout = setTimeout(() => {
                    resetStatsBtn.innerText = "Reset Statistics";
                    resetStatsBtn.classList.replace('bg-red-500', 'bg-red-50');
                    resetStatsBtn.classList.replace('text-white', 'text-red-600');
                    resetStatsBtn.classList.replace('hover:bg-red-600', 'hover:bg-red-100');
                }, 3000);
            } 
            // If it's the second click, execute the reset command!
            else {
                clearTimeout(resetConfirmTimeout);
                try {
                    const encoder = new TextEncoder();
                    await statsCharacteristic.writeValue(encoder.encode("RESET"));
                    
                    // Revert button visually
                    resetStatsBtn.innerText = "Reset Statistics";
                    resetStatsBtn.classList.replace('bg-red-500', 'bg-red-50');
                    resetStatsBtn.classList.replace('text-white', 'text-red-600');
                    resetStatsBtn.classList.replace('hover:bg-red-600', 'hover:bg-red-100');
                } catch (error) {
                    console.error("Failed to write reset command", error);
                }
            }
        });

        // 4. Handle Slider Changes (Send to ESP32)
        targetSlider.addEventListener('input', (e) => {
            targetLabel.innerText = parseFloat(e.target.value).toFixed(1);
        });

        targetSlider.addEventListener('change', async (e) => {
            if (!targetCharacteristic) return;
            const newValue = e.target.value;
            
            try {
                const encoder = new TextEncoder();
                await targetCharacteristic.writeValue(encoder.encode(newValue.toString()));
                console.log(`Sent new target: ${newValue}`);
            } catch (error) {
                console.error("Failed to write to device", error);
            }
        });

        // 5. Handle Disconnection
        function onDisconnected() {
            statusText.innerText = "Device disconnected.";
            livePressure.innerText = "0.0";
            connectBtn.innerText = "Connect via Bluetooth";
            connectBtn.classList.replace('bg-red-500', 'bg-blue-600');
            connectBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
            settingsPanel.classList.add('opacity-30', 'pointer-events-none');
            toggleGraphBtn.classList.add('opacity-30', 'pointer-events-none');
            toggleStatsBtn.classList.add('opacity-30', 'pointer-events-none');
            
            statsCharacteristic = null; // Clean up memory
            
            // Clear graph data
            pressureChart.data.datasets[0].data.fill(0);
            pressureChart.update();
        }

    </script>
</body>
</html>
